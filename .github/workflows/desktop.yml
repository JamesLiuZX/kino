name: Desktop

# Installers for the desktop app: a DMG for Apple Silicon and Intel Macs, a
# Windows installer, and an AppImage and .deb for Linux. Every pull request
# builds them (so packaging can't quietly break); a version tag (v0.2.0) also
# drafts a GitHub release with all of them attached.
#
# Signing is optional. Without these secrets the apps are unsigned (ad-hoc
# signed on macOS) and macOS and Windows warn on first open (the README says
# what to click):
#   macOS:    MAC_CERT_P12 (base64 Developer ID Application .p12), MAC_CERT_PASSWORD,
#             APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID (notarization)
#   Windows:  WIN_CERT_P12 (base64 .pfx), WIN_CERT_PASSWORD

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $version"; exit 1; }

      - run: npm ci --no-audit --no-fund

      - name: Build installers
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CERT_P12: ${{ secrets.WIN_CERT_P12 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            [ -n "$APPLE_ID" ] && extra+=(-c.mac.notarize=true)
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CERT_P12" ]; then
            export CSC_LINK="$WIN_CERT_P12" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Unsigned Macs still need an ad-hoc signature, or Apple Silicon
            # reports the app as damaged instead of offering "Open Anyway".
            [ "$RUNNER_OS" = macOS ] && extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npx electron-builder --config desktop/electron-builder.yml ${{ matrix.target }} --publish never "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: kino-${{ runner.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la installers
          gh release create "${GITHUB_REF_NAME}" installers/* --repo "${{ github.repository }}" --draft --generate-notes \
            --title "Kino ${GITHUB_REF_NAME#v}"
