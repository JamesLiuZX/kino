name: Desktop

# Installers for the desktop app: a DMG for Apple Silicon and Intel Macs, a
# Windows installer, and an AppImage and .deb for Linux. Every pull request
# builds them (so packaging can't quietly break). A version tag (v0.3.1), or
# running this workflow by hand with "Draft a release" ticked, also drafts a
# GitHub release with all of them attached; run by hand, it makes the tag for
# package.json's version itself, so releasing needs no terminal.
#
# Signing is optional. Without these secrets the apps are unsigned (ad-hoc
# signed on macOS): macOS says it can't verify Kino until you click Open Anyway
# in Privacy & Security (the installer window says so), and Windows shows
# SmartScreen. With them, the Mac app is signed with your Developer ID and
# notarized by Apple, and opens like any other app (docs/signing.md):
#   macOS:    MAC_CERT_P12 (base64 Developer ID Application .p12), MAC_CERT_PASSWORD,
#             and for notarization either an App Store Connect API key
#             (APPLE_API_KEY_P8 = the .p8 file's text, APPLE_API_KEY_ID, APPLE_API_ISSUER)
#             or an Apple ID (APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID)
#   Windows:  WIN_CERT_P12 (base64 .pfx), WIN_CERT_PASSWORD

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: ["desktop/**", "package.json", "package-lock.json", ".github/workflows/desktop.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: Draft a release of package.json's version from this commit (makes the tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: --mac
          - os: windows-latest
            target: --win
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Tag and package.json agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} but package.json says $version"; exit 1; }

      - run: npm ci --no-audit --no-fund

      - name: Build installers
        shell: bash
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          WIN_CERT_P12: ${{ secrets.WIN_CERT_P12 }}
          WIN_CERT_PASSWORD: ${{ secrets.WIN_CERT_PASSWORD }}
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ] && [ -n "$MAC_CERT_P12" ]; then
            export CSC_LINK="$MAC_CERT_P12" CSC_KEY_PASSWORD="$MAC_CERT_PASSWORD"
            # electron-builder notarizes whenever one set of credentials is in
            # the environment; the API key goes in as a file.
            if [ -n "$APPLE_API_KEY_P8" ]; then
              printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
              export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
              unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD
            elif [ -z "$APPLE_ID" ]; then
              echo "::warning::Signed but not notarized: macOS will still say it can't verify Kino. Add the notarization secrets (docs/signing.md)."
            fi
          elif [ "$RUNNER_OS" = Windows ] && [ -n "$WIN_CERT_P12" ]; then
            export CSC_LINK="$WIN_CERT_P12" CSC_KEY_PASSWORD="$WIN_CERT_PASSWORD"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            # Unsigned Macs still need an ad-hoc signature, or Apple Silicon
            # reports the app as damaged instead of offering "Open Anyway";
            # and the installer window says how to open it the first time.
            [ "$RUNNER_OS" = macOS ] && extra+=(-c.mac.identity=- -c.mac.hardenedRuntime=false -c.dmg.background=desktop/dmg-background-unsigned.png)
          fi
          npx electron-builder --config desktop/electron-builder.yml ${{ matrix.target }} --publish never "${extra[@]}"

      - uses: actions/upload-artifact@v4
        with:
          name: kino-${{ runner.os }}
          path: |
            dist-desktop/*.dmg
            dist-desktop/*.exe
            dist-desktop/*.AppImage
            dist-desktop/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
      # The notes are this version's section of CHANGELOG.md, then how to open
      # an unsigned build; GitHub's generated notes if the section is missing.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          MAC_SIGNED: ${{ secrets.MAC_CERT_P12 != '' }}
        run: |
          ls -la installers
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            # Run by hand: tag this commit with package.json's version, unless that version is out already.
            tag="v$(node -p "require('./src/package.json').version")"
            if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" > /dev/null 2>&1; then
              echo "::error::$tag already exists. Bump the version in package.json (npm version patch --no-git-tag-version) and run this again."
              exit 1
            fi
            gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA" > /dev/null
          fi
          version="${tag#v}"
          awk -v v="$version" '/^## /{ if (on) exit; on = ($2 == v) ; next } on' src/CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            if [ "$MAC_SIGNED" != true ]; then
              printf '\n### Opening it the first time\n\n**Mac:** Kino isn'"'"'t notarized by Apple yet, so the first time macOS says it can'"'"'t verify it. Click **Done**, open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**, then confirm. After that it opens normally.\n\n**Windows:** SmartScreen may say it protected your PC: click **More info → Run anyway**.\n' >> notes.md
            fi
            notes=(--notes-file notes.md)
          else
            notes=(--generate-notes)
          fi
          gh release create "$tag" installers/* --repo "${{ github.repository }}" --draft "${notes[@]}" \
            --title "Kino $version"
